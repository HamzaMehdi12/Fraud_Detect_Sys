# File: infrastructure/monitoring/prometheus.yml
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'fraud-api'
    static_configs:
      - targets: ['fraud-api:8000']
  - job_name: 'ab-testing'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['fraud-api:8000']